name: netpnl-backend

services:
  # One-shot migration runner against Oracle MySQL Database Service.
  migrate:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    restart: "no"
    env_file:
      - .env
    command: ["alembic", "upgrade", "head"]

  # Production FastAPI backend on port 8000.
  api:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
